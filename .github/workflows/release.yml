# Build the macOS and Windows apps; on a v* tag, attach them (and the GPL toolchain source)
# to a draft GitHub Release. Started by hand (workflow_dispatch) or by pushing a tag.
#
# macOS signing and notarisation need these repository secrets (without them the macOS build
# is ad-hoc signed only):
#   MACOS_CERT_P12        base64 of the Developer ID Application certificate + key (.p12)
#   MACOS_CERT_PASSWORD   its password
#   MACOS_SIGN_IDENTITY   e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool (app-specific password)
# A macOS build that isn't notarised is kept as a workflow artifact but not put in a release
# (macOS would refuse to open it); attach a locally notarised DMG to the release instead.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  macos:
    runs-on: macos-15          # Apple Silicon
    outputs:
      notarised: ${{ steps.done.outputs.notarised }}
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Signing keychain
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"; KP="$(uuidgen)"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
      - name: Notary profile
        if: ${{ env.HAS_NOTARY == 'true' }}
        run: xcrun notarytool store-credentials notary --apple-id "${{ secrets.APPLE_ID }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}"
      - name: Build
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ env.HAS_NOTARY == 'true' && 'notary' || '' }}
        run: scripts/build_macos.sh
      - name: Launcher tests
        run: build/venv/bin/python -m unittest discover -s tests
      - id: done
        run: echo "notarised=${{ env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: scripts/build_windows.ps1
      - name: Launcher tests
        shell: pwsh
        run: build/venv/Scripts/python.exe -m unittest discover -s tests
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Leave out a macOS build that isn't notarised
        if: ${{ needs.macos.outputs.notarised != 'true' }}
        run: rm -rf out/macos-arm64
      - name: GPL source of the bundled toolchain
        run: |
          URL=$(jq -r .toolchain.source runtime.lock.json); SHA=$(jq -r .toolchain.source_sha256 runtime.lock.json)
          curl -fL -o out/$(basename "$URL") "$URL"
          echo "$SHA  out/$(basename "$URL")" | sha256sum -c
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "Mod Matrix Desktop $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md out/*/* out/*.tar.xz
